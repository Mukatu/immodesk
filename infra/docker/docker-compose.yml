name: immodesk

# Pile de développement local pour Immodesk : PostgreSQL, Redis, Garage (S3) et
# Mailpit (capture SMTP, optionnel). Voir infra/README.md pour l'usage complet.
#
# IMPORTANT : le port hôte de PostgreSQL est 5433 (et non 5432, déjà occupé par
# un PostgreSQL 18 local sur cette machine). Ne jamais changer ce mapping.

services:
  postgres:
    image: postgres:16
    container_name: immodesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immodesk}
      POSTGRES_USER: ${POSTGRES_USER:-immodesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immodesk}
      IMMODESK_APP_PASSWORD: ${IMMODESK_APP_PASSWORD:-immodesk_app}
    ports:
      # Hôte 5433 -> conteneur 5432. Ne jamais utiliser 5432 côté hôte.
      - '5440:5432'
    volumes:
      - immodesk_postgres_data:/var/lib/postgresql/data
      # Scripts exécutés automatiquement (ordre alphabétique) au tout premier
      # démarrage (volume de données vide) par l'image postgres officielle.
      - ./init:/docker-entrypoint-initdb.d:ro
      # Schéma consolidé, monté HORS de /docker-entrypoint-initdb.d pour ne
      # pas être auto-exécuté une seconde fois (il est déjà chargé par
      # 01-schema.sh). Chemin en lecture seule.
      - ../../docs/schema/schema.sql:/docker-entrypoint-initdb.d-source/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immodesk -d immodesk']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: immodesk_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6390:6379'
    volumes:
      - immodesk_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Stockage objet compatible S3 : Garage (docs/adr/0014). Image officielle
  # épinglée, sans shell ; la préparation passe par garage-init.
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: immodesk_garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-1d1e0c0d3e5a7f0b9c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a3b}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-immodesk-dev-admin}
    ports:
      - '9010:3900' # API S3
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - immodesk_garage_meta:/var/lib/garage/meta
      - immodesk_garage_data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Rôle du nœud, bucket privé « immodesk » et clé de l'API ; idempotent.
  garage-init:
    image: curlimages/curl:8.23.0
    container_name: immodesk_garage_init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-immodesk-dev-admin}
      S3_BUCKET: immodesk
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-immodesk}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-immodesk-dev-secret}
      S3_ENDPOINT: http://garage:3900
      # Envoi depuis le web de développement (localhost:3000 -> Garage :9010).
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000}
    entrypoint: ['/bin/sh', '/scripts/garage-init.sh']
    volumes:
      - ../deploy/scripts/garage-init.sh:/scripts/garage-init.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit
    container_name: immodesk_mailpit
    restart: unless-stopped
    profiles: ['mail']
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web
    volumes:
      - immodesk_mailpit_data:/data

volumes:
  immodesk_postgres_data:
    name: immodesk_postgres_data
  immodesk_redis_data:
    name: immodesk_redis_data
  immodesk_garage_meta:
    name: immodesk_garage_meta
  immodesk_garage_data:
    name: immodesk_garage_data
  immodesk_mailpit_data:
    name: immodesk_mailpit_data
