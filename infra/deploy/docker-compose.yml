# Pile de recette (staging) Immodesk sur un VPS unique de 4 Go.
# Mode d'emploi pas à pas : docs/10_deploiement.md. Variables : .env (copie
# de .env.staging.example), lu automatiquement par Docker Compose.
#
# Exposition : seul Caddy publie des ports (80 et 443). PostgreSQL et Redis
# vivent sur un réseau interne sans accès Internet ; MinIO n'est joignable
# que par Caddy (API S3, en https) pour les URL signées des mobiles.
name: immodesk-staging

x-logging: &logging
  driver: json-file
  options:
    # Rotation : le journal de l'API contient, en recette, les codes de
    # connexion. Il n'en garde que les derniers mégaoctets.
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: immodesk
      POSTGRES_USER: immodesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à renseigner dans .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500ms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immodesk -d immodesk']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF « everysec » et aucune éviction : une file BullMQ ne doit jamais
    # perdre de job (docs/02 § 14.4).
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory 256mb --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?à renseigner dans .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    logging: *logging

  minio:
    # Les images officielles MinIO ne sont plus publiées en accès libre : même
    # image que la CI, épinglée (voir docs/10_deploiement.md, points ouverts).
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?à renseigner dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?à renseigner dans .env}
      MINIO_BROWSER: 'off'
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      backend: {}
      edge:
        aliases: [immodesk-minio]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  # Tâche ponctuelle : bucket privé et compte d'accès dédié à l'API (jamais le
  # compte administrateur de MinIO).
  minio-init:
    image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: immodesk
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?à renseigner dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?à renseigner dans .env}
    entrypoint: ['/bin/bash', '/scripts/minio-init.sh']
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
    networks: [backend]
    logging: *logging

  # Tâche ponctuelle : `prisma migrate deploy` avec le propriétaire du schéma.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: immodesk-staging/migrate:local
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgresql://immodesk:${POSTGRES_PASSWORD}@postgres:5432/immodesk
    networks: [backend]
    logging: *logging

  # Tâche ponctuelle : ouvre la connexion des rôles immodesk_app (soumis à la
  # RLS) et immodesk_admin (BYPASSRLS, sans superutilisateur) créés NOLOGIN
  # par les migrations, avec leurs mots de passe.
  db-roles:
    image: postgres:16
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: immodesk
      PGDATABASE: immodesk
      PGPASSWORD: ${POSTGRES_PASSWORD}
      IMMODESK_APP_PASSWORD: ${IMMODESK_APP_PASSWORD:?à renseigner dans .env}
      IMMODESK_ADMIN_PASSWORD: ${IMMODESK_ADMIN_PASSWORD:?à renseigner dans .env}
    entrypoint: ['/bin/bash', '/scripts/db-roles.sh']
    volumes:
      - ./scripts/db-roles.sh:/scripts/db-roles.sh:ro
    networks: [backend]
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: immodesk-staging/api:local
    restart: unless-stopped
    depends_on:
      db-roles:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-staging}
      NODE_OPTIONS: --max-old-space-size=768
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Un seul reverse proxy (Caddy) devant l'API : docs/09_exploitation.md § 7.
      TRUST_PROXY_HOPS: '1'
      DATABASE_URL: postgresql://immodesk_app:${IMMODESK_APP_PASSWORD}@postgres:5432/immodesk
      DATABASE_ADMIN_URL: postgresql://immodesk_admin:${IMMODESK_ADMIN_PASSWORD}@postgres:5432/immodesk
      DATABASE_POOL_MAX: '8'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_PREFIX: immodesk-staging
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_HOST:?à renseigner dans .env}
      S3_BUCKET: immodesk
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PDF_WORKER_CONCURRENCY: '1'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?à renseigner dans .env}
      CURSOR_SECRET: ${CURSOR_SECRET:?à renseigner dans .env}
      OTP_PEPPER: ${OTP_PEPPER:?à renseigner dans .env}
      LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:?à renseigner dans .env}
      MOMO_SIMULATOR_SECRET: ${MOMO_SIMULATOR_SECRET:?à renseigner dans .env}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?à renseigner dans .env}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?à renseigner dans .env}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_USERNAME: ${SMS_GATEWAY_USERNAME:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      SMS_GATEWAY_WEBHOOK_SECRET: ${SMS_GATEWAY_WEBHOOK_SECRET:?à renseigner dans .env}
      MOMO_PROVIDER_DEFAULT: ${MOMO_PROVIDER_DEFAULT:-OPENPAY}
      MOMO_WEBHOOK_BASE_URL: https://${API_HOST:?à renseigner dans .env}
      OPENPAY_API_KEY: ${OPENPAY_API_KEY:-}
      OPENPAY_CALLBACK_SECRET: ${OPENPAY_CALLBACK_SECRET:?à renseigner dans .env}
      OPENPAY_CALLBACK_IP_ALLOWLIST: ${OPENPAY_CALLBACK_IP_ALLOWLIST:-}
      CORS_ALLOWED_ORIGINS: https://${WEB_HOST:?à renseigner dans .env}
      PUBLIC_API_BASE_URL: https://${API_HOST}
      PUBLIC_WEB_BASE_URL: https://${WEB_HOST}
      PORTAL_BASE_URL: https://${WEB_HOST}/portail
      INVITATION_BASE_URL: https://${WEB_HOST}/invitations
      PRIVACY_DPO_CONTACT: ${PRIVACY_DPO_CONTACT:-}
    networks:
      backend: {}
      edge:
        aliases: [immodesk-api]
    mem_limit: 1280m
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}/v1
    image: immodesk-staging/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      # Appels serveur à serveur (BFF Next) : directement sur le réseau interne.
      API_INTERNAL_URL: http://api:3000/v1
    networks:
      backend: {}
      edge:
        aliases: [immodesk-web]
    mem_limit: 384m
    logging: *logging

  # Reverse proxy partagé : un seul Caddy par serveur. Les hôtes de chaque
  # projet sont décrits dans un fichier du dossier CADDY_SITES_DIR
  # (ici caddy/sites/immodesk.caddy) ; voir docs/10_deploiement.md § 11.
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?à renseigner dans .env}
      IMMODESK_API_HOST: ${API_HOST}
      IMMODESK_WEB_HOST: ${WEB_HOST}
      IMMODESK_S3_HOST: ${S3_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_SITES_DIR:-./caddy/sites}:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  # Bases et files : aucune sortie vers Internet, aucun port publié.
  backend:
    internal: true
  # Réseau partagé avec le reverse proxy (et, plus tard, les autres projets).
  edge:
    name: ${EDGE_NETWORK:-watuneed_edge}
    external: true
