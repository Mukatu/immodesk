version: 2
updates:
  # Dépendances npm du monorepo pnpm (racine et workspaces)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    open-pull-requests-limit: 5

  # Actions GitHub des workflows, regroupées en une seule PR
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    open-pull-requests-limit: 2

  # Dépendances Flutter/Dart. Les versions sont épinglées sur le SDK
  # Dart 3.11.4 : les montées se font manuellement avec le SDK.
  - package-ecosystem: pub
    directory: '/apps/mobile'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # Images Docker de la pile locale
  - package-ecosystem: docker
    directory: '/infra/docker'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
