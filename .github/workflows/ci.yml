name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed before actions/setup-node so that setup-node's
      # built-in pnpm cache (cache: 'pnpm') can find pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @immodesk/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: immodesk_test
          POSTGRES_USER: immodesk
          POSTGRES_PASSWORD: immodesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stockage objet compatible S3 pour les tests du module documents.
      # Image Bitnami (Docker Hub, sans authentification) : quay.io/minio et
      # docker.io/minio ne sont plus accessibles anonymement. Le bucket est créé
      # par MINIO_DEFAULT_BUCKETS, donc plus besoin du client mc.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=immodesk -e MINIO_ROOT_PASSWORD=immodesk123             -e MINIO_DEFAULT_BUCKETS=immodesk             docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then echo "MinIO prêt"; break; fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null || { echo "MinIO indisponible"; docker logs minio; exit 1; }

      # postgresql-client (psql) is preinstalled on GitHub's ubuntu-latest
      # runners, so no apt-get install step is needed here.
      - name: Load reference schema
        run: PGPASSWORD=immodesk psql -v ON_ERROR_STOP=1 -h localhost -U immodesk -d immodesk_test -f docs/schema/schema.sql

      - name: Enable login for the application role
        run: PGPASSWORD=immodesk psql -v ON_ERROR_STOP=1 -h localhost -U immodesk -d immodesk_test -c "ALTER ROLE immodesk_app WITH LOGIN PASSWORD 'immodesk_app';"

      - name: Generate Prisma client
        run: pnpm --filter @immodesk/api prisma:generate

      - name: Run API integration tests
        env:
          DATABASE_URL: postgresql://immodesk_app:immodesk_app@localhost:5432/immodesk_test
          DATABASE_ADMIN_URL: postgresql://immodesk:immodesk@localhost:5432/immodesk_test
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: immodesk
          S3_ACCESS_KEY: immodesk
          S3_SECRET_KEY: immodesk123
        run: pnpm --filter @immodesk/api test:integration

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @immodesk/web build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle 8.14 / AGP 8.11 / Kotlin 2.2.20 ne savent pas analyser le JDK 25
      # présent par défaut sur le runner ; on épingle le JDK 17.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Aligned with the local toolchain (Flutter 3.41.6 / Dart 3.11.4); the
      # dependency pins in apps/mobile/pubspec.yaml assume this exact SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      # Build debug (pas --release, qui exigerait la clé de signature) pour
      # détecter une régression qui casse la compilation, ce que analyze et
      # test ne voient pas.
      - name: Build
        working-directory: apps/mobile
        run: flutter build apk --debug

  schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: immodesk_test
          POSTGRES_USER: immodesk
          POSTGRES_PASSWORD: immodesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load reference schema
        run: PGPASSWORD=immodesk psql -v ON_ERROR_STOP=1 -h localhost -U immodesk -d immodesk_test -f docs/schema/schema.sql

      # Applique toutes les migrations Prisma sur une base vide, charge
      # schema.sql sur une autre, puis compare les deux (pg_dump normalise
      # + pg_policies). Le script cree et supprime ses propres bases jetables.
      - name: Check migrations match schema.sql
        env:
          PGHOST: localhost
          PGUSER: immodesk
          PGPASSWORD: immodesk
          PGDATABASE: immodesk_test
        run: scripts/ci/check-schema-drift.sh drift

      # Un GUC vide sur une connexion poolee reutilisee leve "invalid input
      # syntax for type uuid" : toutes les policies doivent utiliser NULLIF.
      - name: Guard RLS policies use NULLIF(current_setting())
        env:
          PGHOST: localhost
          PGUSER: immodesk
          PGPASSWORD: immodesk
          PGDATABASE: immodesk_test
        run: scripts/ci/check-schema-drift.sh nullif
