packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: false
  msw: true
  prisma: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.11'
  - '@nestjs/common@12.3.2'
  - '@nestjs/core@12.3.2'
  - '@nestjs/platform-express@12.3.2'
  - '@nestjs/schematics@12.0.11'
  - '@nestjs/swagger@12.0.5'
  - '@nestjs/testing@12.3.2'
