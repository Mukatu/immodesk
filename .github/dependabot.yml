version: 2
updates:
  # NPM ecosystem: manages pnpm workspace root dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Group patch and minor updates together
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Group major updates separately for review
      major:
        update-types:
          - major
    open-pull-requests-limit: 10

  # GitHub Actions ecosystem: keeps workflow actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Pub ecosystem for Flutter/Dart dependencies in mobile app
  # Note: /apps/mobile may be temporarily incomplete/empty as development is ongoing.
  # Dependabot tolerates missing/empty manifests and will simply find nothing to update.
  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Docker ecosystem for Dockerfile dependencies under infra/docker
  # Note: /infra/docker directory structure may be temporarily incomplete/empty.
  # Dependabot tolerates missing/empty manifests and will simply find nothing to update.
  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
